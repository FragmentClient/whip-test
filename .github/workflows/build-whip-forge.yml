name: Build WhipClient Forge 1.8.9

on:
  workflow_dispatch:
  push:
    paths:
      - 'whip-forge/**'
      - '.github/workflows/build-whip-forge.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Download Forge 1.8.9
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.9-11.15.1.2318-1.8.9/forge-1.8.9-11.15.1.2318-1.8.9-universal.jar" -OutFile forge-1.8.9.jar

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/classes | Out-Null
          & javac -source 8 -target 8 -cp forge-1.8.9.jar -d build/classes whip-forge/src/main/java/fragment/whipclient/WhipClientMod.java
          if ($LASTEXITCODE -ne 0) { throw "javac failed" }
          Copy-Item whip-forge/src/main/resources/mcmod.info build/classes/mcmod.info
          Push-Location build/classes
          & jar cf ../../WhipClient-1.8.9.jar .
          if ($LASTEXITCODE -ne 0) { throw "jar failed" }
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: WhipClient-Forge-1.8.9
          path: WhipClient-1.8.9.jar
          if-no-files-found: error
