name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout CI repository
        uses: actions/checkout@v4

      - name: Checkout Whip source
        uses: actions/checkout@v4
        with:
          repository: astunm/whip-client-source
          ref: master
          path: upstream

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare portable dev build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = ((Resolve-Path "upstream").Path -replace '\\','/')
          $sys = "$root/WhipSysCall-master/WhipSysCall-master"
          $nexus = "$root/WhipNexus-Master/WhipNexus-Master"
          $anti = "$root/WhipAntiDebug-master/WhipAntiDebug-master"
          $client = "$root/WhipClient-master/WhipClient-master"

          foreach ($dir in @($sys, $nexus, $anti, $client)) {
            if (!(Test-Path $dir)) { throw "Missing source directory: $dir" }
          }

          $stub = "$root/vmp_ci_stub.h"
          $stubLines = @(
            "#pragma once",
            "#ifndef BUILD_WITH_VMPROTECT",
            "static __inline void VMProtectBegin(const char* name) { (void)name; }",
            "static __inline void VMProtectBeginVirtualization(const char* name) { (void)name; }",
            "static __inline void VMProtectBeginMutation(const char* name) { (void)name; }",
            "static __inline void VMProtectBeginUltra(const char* name) { (void)name; }",
            "static __inline void VMProtectBeginVirtualizationLockByKey(const char* name) { (void)name; }",
            "static __inline void VMProtectBeginUltraLockByKey(const char* name) { (void)name; }",
            "static __inline void VMProtectEnd(void) {}",
            "#endif"
          )
          Set-Content -Path $stub -Value $stubLines

          # WhipSysCall: portable paths, static CRT and no-op VMProtect markers.
          $p = "$sys/CMakeLists.txt"
          $c = Get-Content $p -Raw
          $c = $c.Replace("/MDd", "/MTd").Replace("/MD", "/MT")
          $c = [regex]::Replace($c, 'set\(VMPROTECT_SDK_PATH\s+"[^"]+"\)', 'set(VMPROTECT_SDK_PATH "${CMAKE_CURRENT_SOURCE_DIR}/vmp-disabled")')
          Set-Content -Path $p -Value $c

          # WhipNexus: consume our local WhipSysCall and disable VMProtect.
          $p = "$nexus/CMakeLists.txt"
          $c = Get-Content $p -Raw
          $c = [regex]::Replace($c, 'set\(WHIPSYSCALL_DIR\s+"[^"]+"\s+CACHE PATH "WhipSysCall directory"\)', "set(WHIPSYSCALL_DIR `"$sys`" CACHE PATH `"WhipSysCall directory`" FORCE)")
          $c = [regex]::Replace($c, 'set\(WHIPANTIDEBUG_DIR\s+"[^"]+"\s+CACHE PATH "WhipAntiDebugger directory"\)', "set(WHIPANTIDEBUG_DIR `"$anti`" CACHE PATH `"WhipAntiDebugger directory`" FORCE)")
          $c = [regex]::Replace($c, 'set\(VMPROTECT_SDK_PATH\s+"[^"]+"\)', 'set(VMPROTECT_SDK_PATH "${CMAKE_CURRENT_SOURCE_DIR}/vmp-disabled")')
          Set-Content -Path $p -Value $c

          # Sentinel/WhipAntiDebugger headers contain VMProtect auto-link markers.
          # In this open-source dev build those marker functions are no-ops.
          $markers = "$anti/antidebug/core/vmp_markers.h"
          $m = Get-Content $markers -Raw
          $m = $m.Replace('#pragma comment(lib, "VMProtectSDK32.lib")', '// VMProtect disabled in CI')
          $m = $m.Replace('#pragma comment(lib, "VMProtectSDK64.lib")', '// VMProtect disabled in CI')
          $m = $m.Replace('#pragma comment(lib, "VMProtectARM64.lib")', '// VMProtect disabled in CI')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBegin(const char *);', 'static __inline void VMP_API VMProtectBegin(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBeginVirtualization(const char *);', 'static __inline void VMP_API VMProtectBeginVirtualization(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBeginMutation(const char *);', 'static __inline void VMP_API VMProtectBeginMutation(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBeginUltra(const char *);', 'static __inline void VMP_API VMProtectBeginUltra(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBeginVirtualizationLockByKey(const char *);', 'static __inline void VMP_API VMProtectBeginVirtualizationLockByKey(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectBeginUltraLockByKey(const char *);', 'static __inline void VMP_API VMProtectBeginUltraLockByKey(const char *name) { (void)name; }')
          $m = $m.Replace('VMP_IMPORT void VMP_API VMProtectEnd(void);', 'static __inline void VMP_API VMProtectEnd(void) {}')
          $m = $m.Replace('VMP_IMPORT bool VMP_API VMProtectIsProtected();', 'static __inline bool VMP_API VMProtectIsProtected(void) { return false; }')
          $m = $m.Replace('VMP_IMPORT bool VMP_API VMProtectIsDebuggerPresent(bool);', 'static __inline bool VMP_API VMProtectIsDebuggerPresent(bool check_kernel_mode) { (void)check_kernel_mode; return false; }')
          $m = $m.Replace('VMP_IMPORT bool VMP_API VMProtectIsVirtualMachinePresent(void);', 'static __inline bool VMP_API VMProtectIsVirtualMachinePresent(void) { return false; }')
          $m = $m.Replace('VMP_IMPORT bool VMP_API VMProtectIsValidImageCRC(void);', 'static __inline bool VMP_API VMProtectIsValidImageCRC(void) { return true; }')
          $m = $m.Replace('VMP_IMPORT const char * VMP_API VMProtectDecryptStringA(const char *value);', 'static __inline const char * VMP_API VMProtectDecryptStringA(const char *value) { return value; }')
          $m = $m.Replace('VMP_IMPORT const VMP_WCHAR * VMP_API VMProtectDecryptStringW(const VMP_WCHAR *value);', 'static __inline const VMP_WCHAR * VMP_API VMProtectDecryptStringW(const VMP_WCHAR *value) { return value; }')
          $m = $m.Replace('VMP_IMPORT bool VMP_API VMProtectFreeString(const void *value);', 'static __inline bool VMP_API VMProtectFreeString(const void *value) { (void)value; return true; }')
          Set-Content -Path $markers -Value $m

          # WhipClient: replace old developer-machine paths.
          $p = "$client/CMakeLists.txt"
          $c = Get-Content $p -Raw
          $c = [regex]::Replace($c, 'set\(WHIPNEXUS_DIR\s+"[^"]+"\)', "set(WHIPNEXUS_DIR `"$nexus`")")
          $c = [regex]::Replace($c, 'set\(WHIPNEXUS_LIB\s+"[^"]+"\)', 'set(WHIPNEXUS_LIB "${WHIPNEXUS_DIR}/cmake-build-release/bin/Release/WhipNexus.lib")')
          $c = [regex]::Replace($c, 'set\(WHIPSYSCALL_DIR\s+"[^"]+"\)', "set(WHIPSYSCALL_DIR `"$sys`")")
          $c = [regex]::Replace($c, 'set\(WHIPSYSCALL_LIB\s+"[^"]+"\)', 'set(WHIPSYSCALL_LIB "${WHIPSYSCALL_DIR}/cmake-build-release/WhipSysCall.lib")')
          $c = [regex]::Replace($c, 'set\(WHIPANTIDEBUG_DIR\s+"[^"]+"\)', "set(WHIPANTIDEBUG_DIR `"$anti`")")
          $c = [regex]::Replace($c, 'set\(VMPROTECT_SDK_PATH\s+"[^"]+"\)', 'set(VMPROTECT_SDK_PATH "${CMAKE_CURRENT_SOURCE_DIR}/vmp-disabled")')

          # The current client integrates Sentinel from source; do not require the
          # old prebuilt WhipAntiDebug.lib which is absent from a clean runner.
          $c = [regex]::Replace($c, '(?s)add_library\(WhipAntiDebug STATIC IMPORTED\)\s*set_target_properties\(WhipAntiDebug PROPERTIES.*?\)\s*', '')
          $c = [regex]::Replace($c, '(?m)^\s*WhipAntiDebug\s*

          "WHIP_SYS=$sys" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WHIP_NEXUS=$nexus" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WHIP_CLIENT=$client" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMP_STUB=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build WhipSysCall
        shell: pwsh
        run: |
          $env:CL = "/FI`"$env:VMP_STUB`""
          cmake -S "$env:WHIP_SYS" -B "$env:WHIP_SYS/cmake-build-release" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$env:WHIP_SYS/cmake-build-release" --target WhipSysCall --parallel

      - name: Build WhipNexus
        shell: pwsh
        run: |
          $env:CL = "/FI`"$env:VMP_STUB`""
          cmake -S "$env:WHIP_NEXUS" -B "$env:WHIP_NEXUS/cmake-build-release" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$env:WHIP_NEXUS/cmake-build-release" --target WhipNexus --parallel

      - name: Configure WhipClient
        shell: pwsh
        run: |
          cmake -S "$env:WHIP_CLIENT" -B build-client -G Ninja -DCMAKE_BUILD_TYPE=Release -DWHIP_BUILD_MODE=DEV_STANDALONE -DBUILD_WITH_VMPROTECT=OFF

      - name: Build WhipClient
        shell: pwsh
        run: |
          cmake --build build-client --target WhipClient --parallel

      - name: Upload WhipClient
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-Windows
          path: |
            build-client/bin/WhipClient.dll
            build-client/bin/WhipClient.pdb
          if-no-files-found: error
, '')
          $c += "`ntarget_sources(\${PROJECT_NAME} PRIVATE `"\${WHIPANTIDEBUG_DIR}/antidebug/syscall_bridge.cpp`" `"\${WHIPANTIDEBUG_DIR}/antidebug/tls_callback.c`")`n"

          Set-Content -Path $p -Value $c

          "WHIP_SYS=$sys" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WHIP_NEXUS=$nexus" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WHIP_CLIENT=$client" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VMP_STUB=$stub" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build WhipSysCall
        shell: pwsh
        run: |
          $env:CL = "/FI`"$env:VMP_STUB`""
          cmake -S "$env:WHIP_SYS" -B "$env:WHIP_SYS/cmake-build-release" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$env:WHIP_SYS/cmake-build-release" --target WhipSysCall --parallel

      - name: Build WhipNexus
        shell: pwsh
        run: |
          $env:CL = "/FI`"$env:VMP_STUB`""
          cmake -S "$env:WHIP_NEXUS" -B "$env:WHIP_NEXUS/cmake-build-release" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$env:WHIP_NEXUS/cmake-build-release" --target WhipNexus --parallel

      - name: Configure WhipClient
        shell: pwsh
        run: |
          cmake -S "$env:WHIP_CLIENT" -B build-client -G Ninja -DCMAKE_BUILD_TYPE=Release -DWHIP_BUILD_MODE=DEV_STANDALONE -DBUILD_WITH_VMPROTECT=OFF

      - name: Build WhipClient
        shell: pwsh
        run: |
          cmake --build build-client --target WhipClient --parallel

      - name: Upload WhipClient
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-Windows
          path: |
            build-client/bin/WhipClient.dll
            build-client/bin/WhipClient.pdb
          if-no-files-found: error
