name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Whip sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-MediaFireFile([string]$PageUrl, [string]$Output) {
            Write-Host "Opening $PageUrl"
            $headers = @{ "User-Agent" = "Mozilla/5.0" }
            $page = Invoke-WebRequest -Uri $PageUrl -Headers $headers -UseBasicParsing
            $m = [regex]::Match($page.Content, 'id="downloadButton"[^>]*href="([^"]+)"')
            if (-not $m.Success) {
              $m = [regex]::Match($page.Content, 'href="(https://download[^"]+)"')
            }
            if (-not $m.Success) {
              throw "Could not resolve MediaFire direct download link for $PageUrl"
            }
            $url = [System.Net.WebUtility]::HtmlDecode($m.Groups[1].Value)
            Write-Host "Downloading to $Output"
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $Output
          }

          New-Item -ItemType Directory -Force external | Out-Null
          Get-MediaFireFile "https://www.mediafire.com/file/l7qscbgkik2laas/WhipClient.rar/file" "external/WhipClient.rar"
          Get-MediaFireFile "https://www.mediafire.com/file/6nttk4lsxf8tqx3/WhipLoader.rar/file" "external/WhipLoader.rar"

          & "C:\Program Files\7-Zip\7z.exe" x "external/WhipClient.rar" "-oexternal/WhipClient" -y
          & "C:\Program Files\7-Zip\7z.exe" x "external/WhipLoader.rar" "-oexternal/WhipLoader" -y

          Write-Host "Extracted CMake projects:"
          Get-ChildItem external -Recurse -Filter CMakeLists.txt |
            ForEach-Object { Write-Host $_.FullName }

      - name: Locate client
        id: locate
        shell: pwsh
        run: |
          $candidate = Get-ChildItem external/WhipClient -Recurse -Filter CMakeLists.txt |
            Where-Object { (Get-Content $_.FullName -Raw) -match 'project\(WhipClient' } |
            Select-Object -First 1
          if (-not $candidate) { throw "WhipClient CMakeLists.txt not found after extraction." }
          $dir = $candidate.Directory.FullName
          Write-Host "WhipClient source: $dir"
          "client_dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Inspect dependencies
        shell: pwsh
        run: |
          $client = "${{ steps.locate.outputs.client_dir }}"
          Write-Host "Client directory: $client"
          foreach ($name in @("WhipNexus","WhipSysCall","WhipAntiDebug","WhipAntiDebugger")) {
            Write-Host "---- searching $name ----"
            Get-ChildItem external -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like "*$name*" } |
              Select-Object -First 20 -ExpandProperty FullName |
              ForEach-Object { Write-Host $_ }
          }

      - name: Configure client
        shell: pwsh
        run: |
          $client = "${{ steps.locate.outputs.client_dir }}"
          cmake -S "$client" -B build -G "Visual Studio 17 2022" -A x64 -DWHIP_BUILD_MODE=DEV_STANDALONE -DBUILD_WITH_VMPROTECT=OFF

      - name: Build client
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          $dll = Get-ChildItem build -Recurse -Filter WhipClient.dll | Select-Object -First 1
          if (-not $dll) { throw "WhipClient.dll was not produced." }
          Copy-Item $dll.FullName artifact/WhipClient.dll
          $pdb = Get-ChildItem build -Recurse -Filter WhipClient.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact/WhipClient.pdb }

      - name: Upload WhipClient
        uses: actions/upload-artifact@v4
        with:
          name: WhipClient-Windows
          path: artifact/
          if-no-files-found: error
